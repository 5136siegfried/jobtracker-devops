{% extends "base.html" %}
{% block title %}Login – JobTracker{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">
        <span class="bracket">[</span>JOB<span class="accent">TRACKER</span><span class="bracket">]</span>
      </h1>
      <p class="auth-sub">// système de suivi de candidatures</p>
    </div>

    <form method="post" class="auth-form">
      <div class="field-group">
        <label class="field-label">USERNAME</label>
        <input type="text" name="username" class="field-input" placeholder="your_handle" autofocus required>
      </div>
      <div class="field-group">
        <label class="field-label">PASSWORD</label>
        <input type="password" name="password" class="field-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary btn-full">
        <span class="btn-label">CONNECT</span>
        <span class="btn-arrow">→</span>
      </button>
    </form>

    <p class="auth-switch">
      Pas encore de compte ?
      <a href="{{ url_for('register') }}" class="link-accent">Créer un profil</a>
    </p>
  </div>
</div>
{% endblock %}
